<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Froggly | Post</title>

        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/navigation-bar.css">
        <link rel="stylesheet" href="../css/post.css">
    </head>
    <body>
        <header class="navigation-bar">
            <div class="nav-wrapper">
                <div class="left">
                    <div class="logo">
                        <img src="../assets/logo 1.png" alt="Froggly logo">
                    </div>
                </div>
                <div class="middle">
                    <input type="search" placeholder="Search...">
                </div>
                <div class="right">
                    <a href="index.html">Back to Timeline</a>
                </div>
            </div>
        </header>

        <main class="post-view">
            <div class="post-media">
                <button class="back-btn" id="back-btn" aria-label="Back to timeline">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>

                <img src="" alt="loading..." id="post-image">
                <button class="fullscreen-btn" id="fullscreen-btn" aria-label="View fullscreen">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    </svg>
                </button>
            </div>

            <div class="post-sidebar">
                <div class="post-header">
                    <img class="uploader-avatar" src="../assets/default profile picture.png" alt="Uploader avatar">
                    <div class="uploader-info">
                        <span class="username">loading...</span>
                        <span class="media-type">loading...</span>
                    </div>
                </div>

                <div class="post-caption">
                    <p></p>
                </div>

                <!--<div class="comment-section">
                    <div class="comment-list">
                        <div class="comment">
                            <span class="comment-username"></span>
                            <span class="comment-text"></span>
                        </div>
                        
                    </div>

                    <form class="comment-form">
                        <input type="text" placeholder="Add a comment..." required>
                        <input type="submit" value="Post">
                    </form>
                </div>-->
            </div>
        </main>

        <div class="lightbox" id="lightbox">
            <button class="lightbox-close" id="lightbox-close" aria-label="Close">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
            <img src="" alt="Fullscreen media" id="lightbox-image">
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-config.js"></script>
        <script src="../js/post.js"></script>
        <script src="../js/load-post.js"></script>
        <script src="../js/logout.js"></script>

        <script>
            document.getElementById("back-btn").addEventListener("click", () => {
                // if we got here from the timeline via normal navigation, this restores scroll natively
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    // fallback: no history to go back to (e.g. direct link), just go to timeline
                    window.location.href = "index.html";
                }
            });
        </script>
    </body>
</html>
