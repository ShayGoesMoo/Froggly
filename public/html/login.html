<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Froggly | Login</title>

        <link rel="stylesheet" href="../css/auth.css">
    </head>
    <body>
        <div id="bg-layer-a" class="bg-layer"></div>
        <div id="bg-layer-b" class="bg-layer"></div>
        <div class="register">
            <div class="container">
                <form>
                    <label>Username or Email</label>
                    <input type="text" id="identifier" name="identifer" placeholder="Username or Email..." required>

                    <label>Password</label>
                    <input type="password" id="password" name="password" placeholder="Password..." required>

                    <p class="disclaimer">By completing registeration or logging in with an existing account, you agree to the <a href="/">user agreement</a> and <a href="/">privacy policy</a>.</p>
                    <input type="submit" value="Login">

                    <p class="login">Don't have an account? <a href="../html/register.html">Register here</a>.</p>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-config.js"></script>
        <script src="../js/login.js"></script>
        <script src="../js/game-backgrounds.js"></script>
    </body>
</html>
