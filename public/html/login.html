<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Froggly | Login</title>

        <link rel="stylesheet" href="../css/auth.css">
    </head>
    <body>
        <div class="register">
            <h2>Login</h2>
            <div class="container">
                <form>
                    <label>Username or Email</label>
                    <input type="text" name="user_pass" placeholder="Username or Email..." required>

                    <label>Password</label>
                    <input type="password" name="user_password" placeholder="Password..." required>

                    <p class="disclaimer">By completing registeration or logging in with an existing account, you agree to the <a href="/">user agreement</a> and <a href="/">privacy policy</a>.</p>
                    <input type="submit" value="Login">

                    <p class="login">Don't have an account? <a href="../html/register.html">Register here</a>.</p>
                </form>
            </div>
        </div>
    </body>
</html>
