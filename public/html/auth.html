<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Froggly | Login</title>

        <link rel="stylesheet" href="../css/auth.css">
    </head>
    <body>
        <div class="register">
            <h2>Register</h2>
            <div class="container">
                <form>
                    <label>Name:</label>
                    <input type="text" name="display_name" placeholder="Name..." required>
                    
                    <label>Email:</label>
                    <input type="email" name="email_address" placeholder="Email Address..." required>

                    <label>Date of Birth:</label>
                    <input type="date" name="date_of_birth">

                    <label>Password:</label>
                    <input type="password" name="user_password" placeholder="Password..." required>
                    
                    <label>Confirm Password:</label>
                    <input type="password" name="confirm_user_password" placeholder="Confirm Password..." required>

                    <p class="disclaimer">By registering, you automatically agree to the <a href="/">Terms, Conditions</a> and <a href="/">Privacy Policy</a>.</p>
                    <input type="submit" value="Register">
                </form>
            </div>
        </div>
    </body>
</html>
