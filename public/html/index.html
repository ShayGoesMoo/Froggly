<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Froggly | Home</title>

        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/navigation-bar.css">
        <link rel="stylesheet" href="../css/timeline.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Mukta+Vaani:wght@200;300;400;500;600;700;800&family=Noto+Serif+NP+Hmong:wght@400..700&family=Noto+Serif+Oriya:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">    
    </head>
    <body>
        <header class="navigation-bar">
            <div class="nav-wrapper">
                <div class="left">
                    <div class="logo">
                        <img src="../assets/logo 1.png" alt="Froggly logo">
                    </div>
                </div>
                <div class="middle">
                    <input type="search" placeholder="Search...">
                    <button type="button" id="create-post">New Post</button>
                    <button type="button" id="suggestions-btn">Suggestions</button>
                    <button type="button" id="changelog-btn">Changelog</button>
                    <button type="button" id="settings-btn">Settings</button>
                    <button type="button" id="logout-btn">Logout</button>
                </div>
                <div class="right">
                    <div class="user">
                        <img src="../assets/default profile picture.png" alt="User avatar">
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="timeline">
                
                <!-- repeat for each post -->
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-config.js"></script>
        <script src="../js/timeline.js"></script>
        <script src="../js/logout.js"></script>

        <script>
            // save scroll position whenever the user clicks into a post
            document.querySelectorAll(".timeline-item a").forEach((link) => {
                link.addEventListener("click", () => {
                    sessionStorage.setItem("timelineScroll", window.scrollY);
                });
            });

            // restore scroll position on page load (covers cases where history.back() alone doesn't restore it)
            window.addEventListener("load", () => {
                const savedScroll = sessionStorage.getItem("timelineScroll");
                if (savedScroll !== null) {
                    window.scrollTo(0, parseInt(savedScroll, 10));
                    sessionStorage.removeItem("timelineScroll"); // clear it so it doesn't persist stale on future visits
                }
            });

            document.querySelector("#create-post").addEventListener("click", () => {
                window.location.href = "create-post.html";
            });

            document.querySelector("#settings-btn").addEventListener("click", () => {
                window.location.href = "settings.html";
            });

            document.getElementById("suggestions-btn").addEventListener("click", () => {
                window.location.href = "suggestions.html";
            });

            document.getElementById("changelog-btn").addEventListener("click", () => {
                window.location.href = "changelog.html";
            });
        </script>
    </body>
</html>
